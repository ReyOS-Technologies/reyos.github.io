<!DOCTYPE html>
<html>
<head>
    <title>ReyOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sauce+Sans:wght@400;700&display=swap" rel="stylesheet">

    <style>
		html {
			width: 100%;
			min-height: 100%;
			overflow-x: hidden;
			overflow-y: auto;
		}

		body {
			width: 100%;
			min-height: 100vh;
			margin: 0;
			padding: 20px;
			box-sizing: border-box;

			background-color: #FFFFFF;
			color: #000000;
			font-family: 'Open Sauce Sans', sans-serif;

			overflow-wrap: anywhere;
		}

		/* Headings */
		h1, h2, h3, h4, h5, h6 {
			font-weight: 700;
			max-width: 100%;
			overflow-wrap: anywhere;
		}

		/* Paragraphs */
		p {
			font-weight: 400;
			max-width: 100%;
			overflow-wrap: anywhere;
		}

		/* All elements */
		* {
			box-sizing: border-box;
			max-width: 100%;
		}
    </style>
</head>

<body>
	<img src="src/ReyOS-Background1-Light.png">
    <h1>ReyOS 1.0</h1>
    <p>ReyOS is an easy to use, lightweight, and simple operationg system. It is very stable and supports most Windows applications.</p>
	<h3>REYOS IS STILL UNDER DEVELOPMENT</h3>
</body>
</html>
